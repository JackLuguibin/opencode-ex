# Local PostgreSQL and Redis for the Auth server. Ports are offset from the defaults so they never collide with
# other databases on the machine: `docker compose up -d`, then
# then `bun run test:stack` from the repository root. The tests drop tables and clear runtime keys, so they use their
# own database (`opencode_test`, created on first run) and Redis database 15, never the ones `dev:app` uses.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opencode
      POSTGRES_PASSWORD: opencode
      POSTGRES_DB: opencode
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis:/data
volumes:
  postgres:
  redis:
