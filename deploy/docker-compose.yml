# Full deployment: Postgres (accounts), Redis (execution layer registry and placement), the Auth gateway, two execution
# layers and the web front. Copy .env.example to .env and change the secrets first; then from the repo root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# To add capacity, copy a runtime service with a new name, volume and OPENCODE_ADVERTISE_URL.
x-runtime: &runtime
  build: { context: .., dockerfile: deploy/Dockerfile, target: app }
  restart: unless-stopped
  # On stop the layer leaves the scheduler, waits up to OPENCODE_DRAIN_TIMEOUT_MS (30s) for running sessions, then tears
  # down within 10s; Docker must not kill it before that.
  stop_grace_period: 45s
  # Not ready while starting, draining, stopping or cut off from Redis.
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4096/ready"]
    interval: 5s
    timeout: 3s
    retries: 6
    start_period: 60s
  depends_on: &data-ready
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &runtime-env
    OPENCODE_PASSWORD: ${OPENCODE_PASSWORD}
    OPENCODE_GATEWAY_SECRET: ${OPENCODE_GATEWAY_SECRET}
    OPENCODE_GATEWAY_SECRET_EXTRA: ${OPENCODE_GATEWAY_SECRET_EXTRA:-}
    OPENCODE_IDENTITY_POSTGRES_URL: postgres://opencode:${POSTGRES_PASSWORD}@postgres:5432/opencode
    OPENCODE_REGISTRY_URL: redis://redis:6379
    OPENCODE_ADMIN_EMPLOYEE_ID: ${ADMIN_EMPLOYEE_ID}
    OPENCODE_ADMIN_PASSWORD: ${ADMIN_PASSWORD}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: opencode
    volumes: [postgres:/var/lib/postgresql/data]
    # Execution layers migrate on start, so they must not start before Postgres accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencode -d opencode"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  runtime1:
    <<: *runtime
    # Run from the CLI package: its bunfig.toml sets up the JSX preload the TUI code needs to load.
    working_dir: /app/packages/cli
    command: ["bun", "src/index.ts", "serve", "--hostname", "0.0.0.0", "--port", "4096"]
    environment:
      <<: *runtime-env
      OPENCODE_ADVERTISE_URL: http://runtime1:4096
    volumes: [runtime1:/data]
  runtime2:
    <<: *runtime
    # Run from the CLI package: its bunfig.toml sets up the JSX preload the TUI code needs to load.
    working_dir: /app/packages/cli
    command: ["bun", "src/index.ts", "serve", "--hostname", "0.0.0.0", "--port", "4096"]
    environment:
      <<: *runtime-env
      OPENCODE_ADVERTISE_URL: http://runtime2:4096
    volumes: [runtime2:/data]
  auth:
    build: { context: .., dockerfile: deploy/Dockerfile, target: app }
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    command: ["bun", "packages/auth/src/main.ts"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4100/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s
    environment:
      OPENCODE_GATEWAY_SECRET: ${OPENCODE_GATEWAY_SECRET}
      OPENCODE_REDIS_URL: redis://redis:6379
      OPENCODE_AUTH_HOST: 0.0.0.0
      OPENCODE_AUTH_PORT: "4100"
  web:
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    restart: unless-stopped
    depends_on:
      auth: { condition: service_healthy }
    ports: ["${WEB_PORT:-8080}:80"]

volumes:
  postgres:
  redis:
  runtime1:
  runtime2:
