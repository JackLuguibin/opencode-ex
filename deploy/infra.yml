# Shared Postgres and Redis for every environment; the env file decides which one this is:
#   docker compose -f deploy/infra.yml --env-file deploy/.env.dev  up -d   (bun run dev:infra)
#   docker compose -f deploy/infra.yml --env-file deploy/.env.prod up -d
# COMPOSE_PROJECT_NAME in the env file keeps the environments' containers and volumes apart. BIND_HOST is 127.0.0.1 for
# dev; in production the other machines reach these ports, so restrict them with a firewall or security group
# to the runtime and gateway machines. Neither is meant for the internet.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: opencode
    ports: ["${BIND_HOST:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencode -d opencode"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # An empty REDIS_PASSWORD means no password (dev); production must set one.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports: ["${BIND_HOST:-0.0.0.0}:${REDIS_PORT:-6379}:6379"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; fi; redis-cli ping 2>/dev/null | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
volumes:
  postgres:
  redis:
